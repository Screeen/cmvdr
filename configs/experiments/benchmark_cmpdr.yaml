# Benchmark config for the cMPDR / cMVDR cyclic pipeline.
base: experiments/default.yaml

benchmark:
  algorithm: cmpdr
  sample_limit: 3
  warmup_runs: 1
  output_dir: ./exp_results/benchmarks
  datasets:
    Synthetic: experiments/synthetic.yaml
    MUSAN: experiments/real_freesound.yaml
    DREGON: experiments/real_dregon.yaml

varying_parameters_names: []

beamforming:
  methods_dict:
    mvdr: false
    cmvdr: true
    cmvdr-wl: false
    clcmv: false
    mwf: false
    cmwf: false
    mf: false
  variants: ['blind']
  minimize_noisy_cov_mvdr: true

harmonics_est:
  max_num_harmonics_peaks: 10

cyclic:
  harmonic_threshold: 0.6
