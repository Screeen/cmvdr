# Benchmark config for the MPDR baseline.
base: experiments/default.yaml

benchmark:
  algorithm: mpdr
  sample_limit: 3
  warmup_runs: 1
  output_dir: ./exp_results/benchmarks
  datasets:
    Synthetic: experiments/synthetic.yaml
    MUSAN: experiments/real_freesound.yaml
    DREGON: experiments/real_dregon.yaml

varying_parameters_names: []

beamforming:
  methods_dict:
    mvdr: true
    cmvdr: false
    cmvdr-wl: false
    clcmv: false
    mwf: false
    cmwf: false
    mf: false
  variants: ['blind']
  minimize_noisy_cov_mvdr: true

cyclic:
  P_max: 1
