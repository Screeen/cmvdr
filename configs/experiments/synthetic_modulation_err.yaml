# Description: Configuration file for cMVDR sensitivity test with artificial frequency estimation errors.
# This configuration tests cMVDR robustness to errors in estimated harmonic frequencies.
# The mod_error_perc parameter represents artificial estimation errors (percentage) for sensitivity analysis,
# distinct from inharmonicity_percentage which models physical inharmonicity during signal generation.

base: experiments/default.yaml
varying_parameters_names: [mod_error_perc]
cov_estimation:
  cov_est_forgetting_factor: 0.005 # Higher forgetting factor: more weight to the NEW covariance matrices.
harmonics_est:
  max_num_harmonics_peaks: 16
  algo: oracle_all_harmonics # choices are oracle_all_harmonics, periodogram_all_harmonics, oracle_f0, nls_f0, nls_bayesian_f0
varying_params_values:
  mod_error_perc: [0, 0.01, 0.1, 1, 10.]  # Artificial frequency estimation errors (percentage) for sensitivity analysis
metrics:
  time: [ 'sisdr' ]
